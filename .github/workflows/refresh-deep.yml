name: Refresh Deep Scheme Data

on:
  workflow_dispatch:
  schedule:
    # Rotate through scheme-detail API batches every four hours, all seven days.
    - cron: '41 */4 * * *'

permissions:
  contents: write

concurrency:
  group: mf-data-write
  cancel-in-progress: false

jobs:
  refresh-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Refresh deep factsheet and ratio fields
        run: python scripts/refresh_deep.py

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          f=json.load(open('data/funds.json',encoding='utf-8'))
          d=json.load(open('data/deep_metrics.json',encoding='utf-8'))
          assert len(f)>2000
          assert isinstance(d.get('byCode',{}),dict)
          print('Deep metrics codes:',len(d.get('byCode',{})))
          PY

      - name: Commit deep data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/funds.json data/funds-lite.json data/deep_metrics.json data/deep_cursor.json data/meta.json
          if git diff --cached --quiet; then
            echo 'No deep-data changes.'
          else
            git commit -m 'data: rotate deep scheme metrics'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
