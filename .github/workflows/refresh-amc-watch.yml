name: Refresh Official AMC Watch

on:
  workflow_dispatch:
  schedule:
    # Calendar schedule, not market hours. Offset from :00 to reduce scheduler congestion.
    - cron: '7 */4 * * *'

permissions:
  contents: write

concurrency:
  group: mf-data-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 lxml pandas
      - name: Discover official AMC websites and notices
        run: python scripts/refresh_amc_watch.py
      - name: Validate build after AMC watch
        run: python scripts/validate_build.py
      - name: Commit refreshed AMC/NFO discovery data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/amc_web_registry.json data/amc_watch.json data/amc_nfo_observations.json data/amc_source_health.json data/nfos.json data/source_health.json data/meta.json || true
          if git diff --cached --quiet; then
            echo "No AMC discovery changes to commit."
          else
            git commit -m "data: refresh official AMC watch"
            git pull --rebase origin main
            git push origin main
          fi
